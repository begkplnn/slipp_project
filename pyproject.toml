[project]
name = "slipp"
version = "0.1.0"
description = "Receipts in, loyalty rewards out."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pillow>=10.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
